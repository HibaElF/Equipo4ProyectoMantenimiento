# Análisis de seguridad con CodeQL (GitHub Actions).
# Debe estar en la .github de la raíz del repositorio: GitHub no lee otras.
name: CodeQL

on:
  push:
    branches: [main, Develop, 'feature/**', 'release/**']
  pull_request:
    branches: [main, Develop, 'feature/**', 'release/**']
  schedule:
    - cron: '0 3 * * 1'   # Semanal: lunes a las 03:00 UTC

jobs:
  analyze:
    name: Analizar (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Java 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Compilar backend
        if: matrix.language == 'java-kotlin'
        working-directory: Proyecto_ISO_2627-main/backend
        # mvnw está versionado sin permiso de ejecución.
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package

      - name: Analizar
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
