<ion-tabs (ionTabsDidChange)="cambio($event)">
  <ion-tab-bar slot="bottom" aria-label="Navegación principal">
    @for (p of pestanas; track p.tab) {
      <ion-tab-button [tab]="p.tab">
        <ion-icon [name]="activa() === p.tab ? p.icono : p.icono + '-outline'" aria-hidden="true"></ion-icon>
        <ion-label>{{ p.texto }}</ion-label>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
