spring.application.name=backend

spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=esibuy
spring.mongodb.auto-index-creation=true

app.cors.allowed-origin=${FRONTEND_ORIGIN:https://localhost:4200}

# Puerto: HTTPS local por defecto, Render mediante PORT
server.port=${PORT:8443}
server.address=0.0.0.0

# HTTPS local, desactivable cuando Render termina TLS
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEY_STORE:file:../.certs/localhost.p12}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=esibuy
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# Reconocer HTTPS cuando hay un proxy inverso delante
server.forward-headers-strategy=native

server.servlet.session.timeout=30m
app.security.session.absolute-timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.security.cookies.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
app.security.password.pepper=${APP_SECURITY_PASSWORD_PEPPER:}
# Vida máxima de una contraseña (caducidad); las cuentas existentes empiezan a contar en su primer login.
app.security.password.max-age=30d

# Límites de peticiones. General de la API (en memoria, por instancia): peticiones por usuario (o IP si
# es anónimo) y ventana. Envío de códigos por correo (persistente en MongoDB): por hora y por día y correo.
app.security.rate-limit.api.max-requests=60
app.security.rate-limit.api.window-seconds=60
# Altas públicas (/cliente/register y /vendedor/register) por IP, persistente en MongoDB.
app.security.rate-limit.registro.max-requests=5
app.security.rate-limit.registro.window-seconds=900
app.security.rate-limit.otp.per-hour=3
app.security.rate-limit.otp.per-day=10

# Retención del registro de auditoría (índice TTL de la colección): 12 meses.
app.auditoria.retencion=365d

# Logs en JSON por la consola del servidor (ecs). En local, LOG_FORMAT=logstash cambia el esquema
# y LOG_FORMAT vacío vuelve al texto plano; el correlationId sale también en texto plano.
logging.structured.format.console=${LOG_FORMAT:ecs}
logging.pattern.correlation=[%X{correlationId:-}]
# PowerShell: [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
# Necesario para emitir/verificar OTP de vendedores y administradores.
app.security.email-otp.hmac-key=${APP_SECURITY_EMAIL_OTP_KEY:}

# Subida de imágenes de producto
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Local por defecto; MongoDB para Render
app.productos.imagenes.almacenamiento=${APP_PRODUCTOS_IMAGENES_ALMACENAMIENTO:local}

# Análisis opcional de imágenes con VirusTotal.
virustotal.api-key=${VIRUSTOTAL_API_KEY:}
virustotal.enabled=${VIRUSTOTAL_ENABLED:false}
virustotal.fail-closed=${VIRUSTOTAL_FAIL_CLOSED:true}


# Configuración de Brevo (Sendinblue)
brevo.api-key=${BREVO_API_KEY:}
brevo.from-email=${BREVO_FROM_EMAIL:}
brevo.from-name=${BREVO_FROM_NAME:ESIBuy}
app.frontend-url=${APP_FRONTEND_URL:https://localhost:4200}
